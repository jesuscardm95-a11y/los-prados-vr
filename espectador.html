<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espectador | Los Prados de Hunter</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#122b25;color:#eef9f3}
#bar{position:fixed;top:14px;left:14px;z-index:10;border-radius:14px;padding:15px;background:#0e3028ee;max-width:calc(100vw - 28px);box-shadow:0 3px 25px #0008}
h2{font-size:17px;margin:0 0 9px}p{line-height:1.4;margin:8px 0}
input{width:110px;text-transform:uppercase;letter-spacing:2px;padding:10px;border-radius:8px;border:1px solid #79bfa8;font-weight:bold}
button{padding:10px;border:none;border-radius:8px;background:#26aa82;color:white;cursor:pointer}
a{color:#98e4cc}#info{color:#f4d58a;font-size:12px}#name{font-weight:bold}a-scene{height:100vh;width:100vw}#mapOverlay{display:none;position:fixed;inset:0;z-index:2;background:#102b25ee;align-items:center;justify-content:center}#mapPicture{position:relative;height:min(84vh,86vw);aspect-ratio:882/879;background:url('plano_referencia.png') center/contain no-repeat;border-radius:15px;box-shadow:0 16px 50px #0007}#mapPicture.newPlan:before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background:url('plano_sin_brujula_overlay.svg') center/100% 100% no-repeat}#mapPoint{position:absolute;z-index:2;width:23px;height:23px;border-radius:50%;background:#ffd056;color:#183329;border:2px solid white;text-align:center;font-size:11px;line-height:19px;transform:translate(-50%,-50%)}
</style></head><body>
<div id="bar"><h2>Los Prados · Modo espectador <small style="font-size:10px;opacity:.7">Diagnóstico v2</small></h2><p>Escribe el código que aparece en los lentes:</p>
<input id="room" maxlength="6" placeholder="ABC123" autocomplete="off" aria-label="Código de sesión"/>
<button id="join">Conectar</button> <button id="testImage" type="button" style="background:#315a4d">Probar imagen</button>
<p id="info">Esperando código de sesión.</p><p id="name"></p><p id="diag" style="font-size:11px;color:#b4cebf">Diagnóstico: sin conexión todavía.</p>
<p style="font-size:11px">Verás el punto y la orientación del cliente; no es un vídeo del sistema Quest. <a href="./">Volver al visor</a></p></div>
<a-scene embedded vr-mode-ui="enabled:false" background="color:#24483b" renderer="colorManagement:true;antialias:true" loading-screen="enabled:false">
<a-sky id="sky" rotation="0 -90 0" color="#24483b"></a-sky>
<a-entity id="rig"><a-camera id="camera" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera></a-entity>
<a-entity id="waiting" position="0 0 -4" text="value:Esperando al cliente...;align:center;width:5;color:#ffffff"></a-entity>
</a-scene><div id="mapOverlay"><div id="mapPicture"><span id="mapPoint">01</span></div></div>
<script>
let locations=[{x:72.5,y:46.3},{x:43.4,y:39.3},{x:50.3,y:39.9},{x:64.5,y:25},{x:45.5,y:63.7},{x:37,y:53},{x:32.5,y:54},{x:44.5,y:29},{x:48,y:70},{x:43.7,y:24.8}];
const newMapPositions=[[46.7,77.5],[48.7,71.0],[50.6,64.9],[71.7,67.2],[21.4,46.6],[54.9,24.8],[39.5,29.3],[56.1,33.8],[62,48.5],[80.2,52.4]];
function updateMapInSpectator(){
 const newer=new Image();
 newer.onload=()=>{
   const picture=document.getElementById('mapPicture');
   picture.style.backgroundImage="url('Los_Prados_Plano_Optimizado_VR.jpg')";
   picture.classList.add('newPlan');
   picture.style.aspectRatio='1402/1122';
   picture.style.width='min(90vw, calc(84vh * 1.24955))';
   picture.style.height='auto';
   locations=newMapPositions.map(([x,y])=>({x,y}));
   if(sceneIndex>=0){
      const point=document.getElementById('mapPoint');
      point.style.left=locations[sceneIndex].x+'%';
      point.style.top=locations[sceneIndex].y+'%';
   }
 };
 newer.src='Los_Prados_Plano_Optimizado_VR.jpg';
}
updateMapInSpectator();
const names=['01 · Pórtico principal','02 · Parque principal, vista 1','03 · Parque principal, vista 2','04 · Avenida de acceso','05 · Parque del Recuerdo','06 · Avenida interior','07 · Parque para niños','08 · Avenida 03','09 · Avenida 05','10 · Cancha multiusos'];
const keys=['01. TOUR PÓRTICO','03. TOUR 02 PARQUE1','02. TOUR 01 PARQUE 1','04. TOUR AVENIDA','05. TOUR PARQUE 2','06. TOUR AVENIDA','07. TOUR PARQUE PARA NIÑOS','08. TOUR AVENIDA 03','09. TOUR AVENIDA 05','10. TOUR CANCHA MULTIUSOS'];
const info=document.getElementById('info'),label=document.getElementById('name'),sky=document.getElementById('sky'),camera=document.getElementById('camera'),waiting=document.getElementById('waiting'),diag=document.getElementById('diag');
function diagnostics(message){diag.textContent='Diagnóstico: '+message}
let peer=null,connection=null,sceneIndex=-1,loadingIndex=-1,imageToken=0,loadedTexture=null,receivedState=false,receivedWelcome=false,packetsReceived=0,sceneReady=false,helloInterval=null,sessionSerial=0;
function status(s){info.textContent=s}
// Impedir descargas repetidas mientras llegan actualizaciones de orientación (4 por segundo).
function updateImage(index){
 if(index===sceneIndex&&(loadingIndex===index||loadedTexture&&loadingIndex===-1))return;
 sceneIndex=index;loadingIndex=index;
 const token=++imageToken;
 const image=new Image();
 let attempt=0;
 status('Recibiendo punto '+String(index+1).padStart(2,'0')+'. Descargando panorámica...');
 function next(){
  if(token!==imageToken)return;
  if(attempt>=4){
    diagnostics('falló la descarga de 4 formatos para imagen '+(index+1));
    loadingIndex=-1;sceneIndex=-1;
    status('No se pudo descargar la panorámica '+(index+1)+'. Comprueba Internet y recarga.');
    return;
  }
  image.src=encodeURIComponent(keys[index]+'.'+['jpg','jpeg','png','webp'][attempt++]);
 }
 image.onload=()=>{
  if(token!==imageToken)return;
  const mesh=sky.getObject3D('mesh');
  if(!mesh){
    status('Preparando el visor del asesor...');
    // No reiniciar la descarga mientras todavía se crea la escena.
    const scene=document.querySelector('a-scene');
    scene.addEventListener('loaded',()=>{
      if(token!==imageToken)return;
      loadingIndex=-1;sceneIndex=-1;updateImage(index);
    },{once:true});
    return;
  }
  try{
    const t=new THREE.Texture(image);
    t.colorSpace=THREE.SRGBColorSpace;
    t.minFilter=THREE.LinearFilter;
    t.magFilter=THREE.LinearFilter;
    t.generateMipmaps=false;
    t.needsUpdate=true;
    const m=new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,color:0xffffff});
    if(loadedTexture){loadedTexture.t.dispose();loadedTexture.m.dispose();}
    mesh.material=m;loadedTexture={t,m};
    loadingIndex=-1;
    waiting.setAttribute('visible',false);
    diagnostics('imagen '+String(index+1).padStart(2,'0')+' cargada · '+image.naturalWidth+' × '+image.naturalHeight+' px. Paquetes: '+packetsReceived);
    label.textContent=names[index];
    status('Transmitiendo · '+names[index]);
  }catch(error){
    loadingIndex=-1;sceneIndex=-1;
    status('Error al mostrar el panorama: '+error.message);
    diagnostics('excepción renderizando la panorámica: '+error.message);
    console.error(error);
  }
 };
 image.onerror=next;
 next();
}
function reset(){
 if(helloInterval){clearInterval(helloInterval);helloInterval=null;}
 sessionSerial++;
 if(connection){try{connection.close()}catch(e){}}
 if(peer){try{peer.destroy()}catch(e){}}
 peer=null;connection=null;
}
function join(){
 const code=document.getElementById('room').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(!/^[A-Z0-9]{6}$/.test(code)){status('Ingresa el código de 6 caracteres mostrado en los lentes.');return;}
 reset();receivedState=false;receivedWelcome=false;packetsReceived=0;sceneIndex=-1;loadingIndex=-1;status('Conectando...');label.textContent='';waiting.setAttribute('visible',true);diagnostics('buscando sala '+code);
 if(typeof Peer==='undefined'){status('No cargó la biblioteca de conexión. Comprueba Internet.');return;}
 peer=new Peer();
 peer.on('open',()=>{
  connection=peer.connect('efcom-prados-'+code.toLowerCase(),{reliable:true,serialization:'json'});
  connection.on('open',()=>{
    status('Canal conectado. Solicitando la primera panorámica...');
    diagnostics('WebRTC abierto; esperando confirmación del visor');
    const serial=sessionSerial;
    const hello=()=>{
      if(serial!==sessionSerial||!connection||!connection.open||receivedState)return;
      try{connection.send({type:'hello',at:Date.now()});}catch(e){diagnostics('no pudo enviarse la solicitud: '+e.message)}
    };
    hello();
    helloInterval=setInterval(hello,1600);
    setTimeout(()=>{
      if(serial!==sessionSerial||!connection||!connection.open||receivedState)return;
      diagnostics(receivedWelcome?'visor confirmó la sesión, pero no llegaron estados VR':'la sala conectó, pero no llegó respuesta del visor');
      status('La conexión existe, pero no llegan las panorámicas. Consulta Diagnóstico.');
    },10500);
  });
  connection.on('data',msg=>{
    if(!msg)return;
    if(msg.type==='welcome'){receivedWelcome=true;status('Quest confirmado. Esperando panorama...');diagnostics('respuesta recibida de Quest; esperando estado VR');return;}
    if(msg.type!=='state')return;
    if(!Number.isInteger(msg.index)||msg.index<0||msg.index>=keys.length)return;
    receivedState=true;packetsReceived++;
    if(helloInterval){clearInterval(helloInterval);helloInterval=null;}
    if(packetsReceived===1)diagnostics('primer estado recibido · panorámica '+(msg.index+1));
    document.getElementById('mapOverlay').style.display=msg.map?'flex':'none';
    if(msg.map){const point=document.getElementById('mapPoint');point.textContent=String(msg.index+1).padStart(2,'0');point.style.left=locations[msg.index].x+'%';point.style.top=locations[msg.index].y+'%';label.textContent='Cliente viendo el plano · '+names[msg.index];status('Vista aérea sincronizada · '+names[msg.index]);}
    else updateImage(msg.index);
    if(msg.q&&msg.q.length===4&&msg.q.every(Number.isFinite)){
      camera.object3D.quaternion.set(...msg.q);
    }
    // No sobrescribir 'Descargando panorámica...' con cada paquete recibido.
    if(packetsReceived%40===0){console.debug('Paquetes del visor recibidos:',packetsReceived)}
  });
  connection.on('close',()=>{status('Conexión cerrada. Puedes reconectar.');diagnostics('canal cerrado');if(helloInterval){clearInterval(helloInterval);helloInterval=null;}});
  connection.on('error',e=>{status('Error de conexión. Prueba de nuevo.');diagnostics('error de WebRTC: '+(e&&e.message||String(e)))});
  setTimeout(()=>{if(connection&&!connection.open)status('No conecta. Comprueba que el cliente haya iniciado la sesión y el código sea correcto.');},10000);
 });
 peer.on('disconnected',()=>{
   diagnostics('servidor de sesiones desconectado: intentando reconectar');
   try{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect();}catch(err){diagnostics('No se pudo reconectar: '+err.message);}
 });
 peer.on('error',e=>{
   const type=e&&e.type||'desconocido';
   if(type==='peer-unavailable'){
     status('Ese código no tiene una sala activa. Pide un código nuevo en los Quest.');
   }else{
     status('Error de conexión: '+type+'. Comprueba la sesión.');
   }
   diagnostics('error de señalización: '+type);
 });
}
document.getElementById('join').onclick=join;
document.getElementById('testImage').onclick=()=>{
  diagnostics('solicitando panorámica 01 de prueba sin los lentes');
  sceneIndex=-1;loadingIndex=-1;updateImage(0);
};
document.getElementById('room').onkeydown=e=>{if(e.key==='Enter')join()};
const params=new URLSearchParams(location.search);
if(params.has('sala')){
 const code=params.get('sala').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
 document.getElementById('room').value=code;
 if(/^[A-Z0-9]{6}$/.test(code))join();
}
</script></body></html>
